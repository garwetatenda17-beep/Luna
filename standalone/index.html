<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUNA</title>
<meta name="description" content="LUNA — build your online shop in 2 minutes. Get paid with EcoCash or cash on delivery.">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: three worlds — a black/gold setup wizard, a white admin dashboard, a bright public storefront. */
:root{
  --ink:#0B0B0C; --ink-2:#17171A; --ink-3:#26262B;
  --gold:#F5B700; --gold-2:#FFD34D; --green:#12B76A; --green-d:#0A8F52; --hot:#FF4D1C;
  --bg:#F5F5F2; --card:#FFFFFF; --line:#E7E6E1; --text:#15171C; --muted:#6A6F78; --soft:#F0EFEA;
  --red:#E5484D; --amber:#B7791F;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-lg:22px;
  --shadow:0 1px 2px rgba(20,20,10,.06), 0 4px 16px rgba(20,20,10,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;text-decoration:none;transition:transform .12s, background .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:#111}
.btn-gold:hover{background:var(--gold-2)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-ghost-dark{background:transparent;border:1px solid #3a3a40;color:#fff}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- WIZARD (black + gold + green) ---------- */
.wz{min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%, rgba(245,183,0,.16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(18,183,106,.14), transparent 60%), var(--ink);color:#fff;padding:20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left))}
.wz-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:18px}
.moon{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #FFE58A, var(--gold) 55%, #C98E00);box-shadow:0 0 24px rgba(245,183,0,.5);position:relative;flex:none}
.moon::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:var(--ink);top:-3px;left:10px}
.hero-h{font-family:var(--display);font-size:clamp(36px,9vw,58px);line-height:1.02;font-weight:800;margin:28px 0 12px;text-wrap:balance;letter-spacing:-.02em}
.hero-h em{font-style:normal;color:var(--gold)}
.wz p.lead{color:#B9B9C0;font-size:17px;max-width:46ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #2f2f35;background:#141417;border-radius:999px;padding:7px 12px;font-size:13px;color:#d8d8de}
.pill b{color:var(--gold)}
.landing-cta{display:grid;gap:10px;margin-top:26px}
.demo-peek{margin-top:34px;border:1px solid #26262c;border-radius:var(--r-lg);overflow:hidden;background:#111114}
.demo-peek .row{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.demo-peek img{aspect-ratio:1;object-fit:cover;width:100%}
.demo-peek .cap{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:#cfcfd6}

.steps{display:flex;gap:6px;margin:22px 0 8px}
.steps i{flex:1;height:5px;border-radius:9px;background:#2a2a30}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--green))}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.wz h2{font-family:var(--display);font-size:32px;line-height:1.08;margin:8px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.wz .sub{color:#A9A9B2;margin:0 0 20px}
.choice-grid{display:grid;gap:12px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;background:#141417;border:1.5px solid #2a2a30;border-radius:18px;padding:18px;color:#fff;transition:border-color .2s, background .2s}
.choice:hover{border-color:#4a4a52}
.choice.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,183,0,.09),rgba(245,183,0,.02))}
.choice .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#1e1e23;flex:none}
.choice b{display:block;font-size:17px}
.choice small{color:#A0A0A8;font-size:13px}
.choice .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid #3a3a42;flex:none}
.choice.on .tick{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 4px #141417}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.city{padding:18px 16px;border-radius:18px;border:1.5px solid #2a2a30;background:#141417;color:#fff;text-align:left}
.city.on{border-color:var(--green);background:linear-gradient(180deg,rgba(18,183,106,.12),rgba(18,183,106,.02))}
.city b{font-family:var(--display);font-size:20px;display:block}
.city small{color:#9d9da6}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:#cfcfd6}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #2c2c33;background:#111114;color:#fff;font-size:16px}
.inp:focus{border-color:var(--gold);outline:none}
.ask{display:flex;gap:8px}
.ask .inp{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{border:1px solid #33333a;background:#151518;color:#ddd;border-radius:999px;padding:7px 12px;font-size:13px}
.chip:hover{border-color:var(--gold);color:#fff}
.verdict{border-radius:20px;overflow:hidden;background:#141417;border:1px solid #2a2a30;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.verdict .top{display:flex;gap:14px;padding:16px}
.verdict .ph{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:none;background:#222}
.verdict .ph.none{display:grid;place-items:center;font-size:34px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-family:var(--display);font-size:22px;letter-spacing:.02em}
.lvl.HOT{color:var(--hot)}
.lvl.GOOD{color:var(--green)}
.lvl.SATURATED{color:#FF5A5F}
.verdict .nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #26262c}
.verdict .nums div{padding:12px 14px;border-right:1px solid #26262c}
.verdict .nums div:last-child{border-right:0}
.verdict .nums small{display:block;color:#8e8e98;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.verdict .nums b{font-size:18px}
.verdict .say{padding:14px 16px;border-top:1px solid #26262c;color:#d7d7de;font-size:14px}
.verdict .say b{color:var(--gold)}
.est{font-size:11px;color:#7d7d86;padding:0 16px 14px}
.preview-card{border-radius:20px;padding:18px;background:linear-gradient(135deg,#1b1b1f,#121214);border:1px solid #2a2a30;display:flex;gap:14px;align-items:center}
.logo{display:grid;place-items:center;border-radius:14px;font-family:var(--display);font-weight:800;color:#111;flex:none}
.wz-nav{display:flex;gap:10px;margin-top:26px}
.wz-nav .btn{padding:15px 20px;font-size:16px}
.done{text-align:center;padding-top:10px}
.done .burst{font-size:64px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.linkbox{display:flex;align-items:center;gap:8px;background:#0f0f12;border:1px dashed #3a3a42;border-radius:14px;padding:12px 14px;margin:16px 0;text-align:left}
.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--gold);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.err{color:#FF8A8A;font-size:13px;margin-top:-6px;margin-bottom:10px}

/* ---------- ADMIN (white, clean) ---------- */
.adm{min-height:100vh;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left))}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.shopid{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.shopid .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green-d);font-weight:600}
.online i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(18,183,106,.6);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,183,106,.55)}80%,100%{box-shadow:0 0 0 7px rgba(18,183,106,0)}}
.shop-switch{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:13px;max-width:170px}
.topbar .shop-switch{display:none}
@media (min-width:640px){.topbar .shop-switch{display:block}.switch-row{display:none!important}}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;padding:12px 16px}
.switch-row .shop-switch{max-width:60%}
.online{white-space:nowrap}
.adm-wrap{max-width:1180px;margin:0 auto;display:flex;gap:24px;padding:18px max(16px, env(safe-area-inset-right)) 110px max(16px, env(safe-area-inset-left))}
.side{display:none}
.main{flex:1;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--green)}
@media (min-width: 920px){
  .tabs{display:none}
  .side{display:block;width:210px;flex:none;position:sticky;top:76px;align-self:flex-start}
  .side .tab{grid-template-columns:24px 1fr;justify-items:start;align-items:center;gap:10px;font-size:14px;padding:10px 12px;width:100%;text-align:left}
  .side .tab.on{background:#fff;box-shadow:var(--shadow)}
  .adm-wrap{padding-bottom:40px}
}
.h1{font-family:var(--display);font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.mut{color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
.sec-h h3{font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:16px}
.stat small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-family:var(--display);font-size:28px;margin-top:6px;letter-spacing:-.01em}
.stat .delta{font-size:12px;color:var(--muted)}
.stat.balance{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.balance small{color:#B9B9C0}
.stat.balance b{color:var(--gold)}
.notice{display:flex;gap:10px;align-items:flex-start;background:#FFF8E1;border:1px solid #F6E2A4;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.notice button{margin-left:auto;flex:none}
.linkcard{padding:16px;display:grid;gap:12px;margin-top:14px}
.urlrow{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px}
.urlrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:1.3fr 1fr}}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.b-green{background:#E3F8EE;color:#08744A}
.b-amber{background:#FFF3D6;color:#8A5A00}
.b-gray{background:#EEEEEA;color:#4c5058}
.b-blue{background:#E6F0FF;color:#1D4ED8}
.b-sample{background:#F3E8FF;color:#6B21A8}
.prod-grid{display:grid;gap:12px}
@media (min-width:640px){.prod-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.prod-grid{grid-template-columns:1fr 1fr 1fr}}
.pcard{display:flex;gap:14px;padding:12px;align-items:center}
.pcard img{width:88px;height:88px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.pcard .grow{flex:1;min-width:0}
.pcard .t{font-weight:700}
.pcard .price{font-family:var(--display);font-size:20px;font-weight:700}
.pcard .was{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px}
.stock{font-size:13px;color:var(--muted)}
.stock.low{color:var(--red);font-weight:600}
.add-tile{display:grid;place-items:center;gap:6px;border:2px dashed #D4D3CC;border-radius:var(--r);padding:22px;color:var(--muted);background:transparent;font-weight:600;min-height:112px}
.add-tile:hover{border-color:var(--green);color:var(--green-d)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.order{padding:14px 16px;display:grid;gap:10px}
.order .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order .who{font-weight:700}
.order .items{font-size:14px;color:#3a3d44}
.order .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.order .total{font-family:var(--display);font-size:20px;font-weight:700;margin-right:auto}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.promo-hero{border-radius:var(--r-lg);padding:20px;background:linear-gradient(120deg,#FF4D1C,#FF8A00 60%,#F5B700);color:#fff;position:relative;overflow:hidden}
.promo-hero h2{font-family:var(--display);font-size:28px;margin:0 0 4px;line-height:1.05}
.promo-hero p{margin:0;max-width:46ch;opacity:.95}
.promo-hero::after{content:"♪";position:absolute;right:18px;top:6px;font-size:90px;opacity:.18;font-family:var(--display)}
.promo-list{display:grid;gap:12px;margin-top:14px}
@media (min-width:700px){.promo-list{grid-template-columns:1fr 1fr}}
.wallet{border-radius:var(--r-lg);padding:22px;color:#fff;background:radial-gradient(500px 200px at 100% 0%, rgba(245,183,0,.35), transparent 60%), linear-gradient(140deg,#121214,#1f1f24);position:relative;overflow:hidden}
.wallet small{color:#B9B9C0;text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}
.wallet .bal{font-family:var(--display);font-size:44px;font-weight:800;color:var(--gold);margin:4px 0 12px;letter-spacing:-.02em}
.ecocash{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.ecocash .ec{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;font-weight:800;color:#0A4D9C;font-size:12px}
.checklist{padding:6px 0}
.check{display:flex;gap:10px;align-items:center;padding:10px 16px;font-size:14px}
.check i{width:20px;height:20px;border-radius:50%;border:2px solid #CFCEC7;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.check.ok i{background:var(--green);border-color:var(--green)}
.check.ok span{color:var(--muted);text-decoration:line-through}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;color:var(--text);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px, env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-family:var(--display);font-size:22px;margin:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.f{display:grid;gap:6px;margin-bottom:12px}
.f label{font-size:13px;font-weight:600}
.f input,.f textarea,.f select{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px;width:100%}
.f input:focus,.f textarea:focus{border-color:var(--green);outline:none}
.f .hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery button{padding:0;border:2.5px solid transparent;border-radius:12px;overflow:hidden;background:var(--soft)}
.gallery button.on{border-color:var(--green)}
.gallery img{aspect-ratio:1;object-fit:cover;width:100%}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s;max-width:calc(100% - 32px)}

/* ---------- promo video ---------- */
.reel{position:relative;width:min(100%, 330px);aspect-ratio:9/16;margin:0 auto;border-radius:20px;overflow:hidden;background:#000;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.reel .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.3) translate(-3%,-4%)}}
.reel .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.85) 100%)}

/* =========================================================================

"use strict";

const $ = (s, el = document) => el.querySelector(s);

function askLuna(text, cityName) {
  const q = String(text || "").toLowerCase().trim();

  const level = sellers < 30 ? "HOT" : sellers < 90 ? "GOOD" : "SATURATED";
  const keep = Math.max(1, Math.round((best.sell - best.supplier) * 0.7));
  let say;
  if (level === "HOT") say = `🔥 <b>Few sellers, lots of buyers</b> in ${esc(city.name)}. Great pick — list it today.`;
  else if (level === "GOOD") say = `🟢 <b>Healthy market.</b> Stand out with clear photos, fast delivery and EcoCash.`;

    say = `🔴 <b>Too many sellers</b> in ${esc(city.name)} — prices get pushed down. Try <b>${esc(alt.name)}</b> instead.`;
  }
  return { known: true, product: best, level, sellers, keep, city: city.name, say };
}

/* ---------- data ---------- */
const KEY = "luna.store.v1";

/* ---------- metrics (computed from real orders & visits) ---------- */
function metrics(s) {
  const paid = s.orders.filter((o) => o.status === "paid" || o.status === "delivered");
  const todays = s.orders.filter((o) => today(o.at));
  return {
    salesToday: paid.filter((o) => today(o.at)).reduce((a, o) => a + o.total, 0),
    ordersToday: todays.length,
    pending: s.orders.filter((o) => o.status !== "delivered").length,
    viewsToday: s.views.filter(today).length,
    viewsAll: s.views.length,
    balance: paid.reduce((a, o) => a + o.total, 0) - s.withdrawals.reduce((a, w) => a + w.amt, 0),
    hasSamples: s.orders.some((o) => o.sample),
  };
}

  },
  editProduct(d) { sheetProduct(d.id); },
  pickImg(d, el) { UI.pickImg = d.url; el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); $("#pu").value = ""; },
  delProduct(d) { const s = shop(); s.products = s.products.filter((p) => p.id !== d.id); save(); closeSheet(); render(); toast("Product deleted"); },
  promo(d) { sheetPromo(d.id); },
  playMusic: toggleMusic, makeVideo, sharePromo,
  editEco() { openSheet(`<div class="sheet-h"><h3>EcoCash number</h3><button class="x" data-a="close" aria-label="Close">×</button></div><form data-form="eco"><div class="f"><label for="ecn">Number customers pay to</label><input id="ecn" name="eco" inputmode="tel" maxlength="13" value="${esc(shop().ecocash)}" required></div><button class="btn btn-green btn-block" type="submit">Save</button></form>`); },
  withdraw() {
    const m = metrics(shop());
    openSheet(`<div class="sheet-h"><h3>Withdraw</h3><button class="x" data-a="close" aria-label="Close">×</button></div>
      <p class="mut" style="margin-top:0">Customers pay straight into your EcoCash, so this money is already on your phone. Withdrawing here records the cash you took out, so your balance stays correct.</p>
      <form data-form="withdraw"><div class="f"><label for="wa">Amount (USD)</label><input id="wa" name="amt" type="number" min="1" step="0.5" max="${m.balance}" value="${m.balance}" required></div>
      <div class="f"><label>To EcoCash</label><input value="${esc(fmtPhone(shop().ecocash))}" readonly></div><button class="btn btn-gold btn-block" type="submit">Withdraw ${money(m.balance)}</button></form>`);
  },
  pd(d) { sheetPD(d.id); },
  addCart(d) { const c = UI.cart.find((x) => x.id === d.id); if (c) c.qty++; else UI.cart.push({ id: d.id, qty: 1 }); if (d.close) closeSheet(); render(); toast("🛒 Added to cart"); },
  buyNow(d) { if (!UI.cart.some((x) => x.id === d.id)) UI.cart.push({ id: d.id, qty: 1 }); render(); sheetCheckout("ecocash"); },
  cart() { sheetCart(); },
  qty(d) { const c = UI.cart.find((x) => x.id === d.id); c.qty += +d.v; if (c.qty <= 0) UI.cart = UI.cart.filter((x) => x !== c); render(); sheetCart(); },
  checkout() { sheetCheckout(UI.payMethod || "ecocash"); },
  payMethod(d, el, e) { e.preventDefault(); const f = $("[data-form=checkout]"); const keep = { name: f.name.value, phone: f.phone.value, area: f.area.value }; sheetCheckout(d.v); const g = $("[data-form=checkout]"); g.name.value = keep.name; g.phone.value = keep.phone; g.area.value = keep.area; },
  close() { closeSheet(); },
  scrim(d, el, e) { if (e.target === el) closeSheet(); },
};

const FORMS = {
  ask(f) { UI.wz.q = f.q.value; UI.wz.v = askLuna(f.q.value, UI.wz.city); render(); },
  name() { A.wzNext(); },
  product(f) {
    const s = shop(), id = f.dataset.id, url = f.url.value.trim();
    if (url && !/^https:\/\/\S+$/.test(url)) return toast("Image link must start with https://");
    const data = { name: f.name.value.trim(), price: +f.price.value, was: +f.was.value || 0, stock: Math.max(0, Math.round(+f.stock.value)), desc: f.desc.value.trim(), img: url || UI.pickImg };
    if (id) Object.assign(s.products.find((p) => p.id === id), data); else s.products.push({ id: "p" + uid(), ...data });
    save(); closeSheet(); render(); toast(id ? "✓ Saved" : "✓ Product added to your store");
  },
  eco(f) { const d = f.eco.value.replace(/\D/g, ""); if (!/^07\d{8}$/.test(d)) return toast("Enter a 10-digit number starting with 07"); shop().ecocash = d; save(); closeSheet(); render(); toast("✓ EcoCash number saved"); },
  withdraw(f) { const s = shop(), amt = Math.min(+f.amt.value, metrics(s).balance); if (!(amt > 0)) return; s.withdrawals.push({ amt, at: Date.now() }); save(); closeSheet(); render(); toast(`✓ ${money(amt)} withdrawal recorded`); },
  checkout(f) {
    const s = UI.store, method = UI.payMethod || "ecocash";
    const phone = f.phone.value.replace(/\D/g, "");
    if (!/^0\d{9}$/.test(phone)) return toast("Enter a 10-digit phone number");
    const items = UI.cart.map((c) => { const p = s.products.find((x) => x.id === c.id); return { pid: p.id, name: p.name, qty: c.qty, price: p.price }; });
    const order = { id: "LN-" + uid(), customer: f.name.value.trim(), phone, area: f.area.value.trim() + ", " + s.city, items, total: cartTotal(), method, ref: method === "ecocash" ? f.ref.value.trim() : "", status: method === "ecocash" ? "awaiting" : "cod", at: Date.now() };
    const owned = DB.shops[s.slug] && !s.visitor;
    if (owned) { s.orders.push(order); items.forEach((i) => { const p = s.products.find((x) => x.id === i.pid); p.stock = Math.max(0, p.stock - i.qty); }); save(); }
    UI.cart = []; render();
    const msg = `🛍️ New order ${order.id} — ${s.name}\n${items.map((i) => `${i.qty}× ${i.name} (${money(i.price)})`).join("\n")}\nTotal: ${money(order.total)}\nPayment: ${method === "ecocash" ? "EcoCash, code " + order.ref : "Pay on Delivery"}\nName: ${order.customer}\nPhone: ${fmtPhone(phone)}\nDeliver to: ${order.area}`;
    openSheet(`<div style="text-align:center;padding:10px 0"><div style="font-size:54px">✅</div><h3>Order placed!</h3><p class="mut">Order <b class="tnum">${esc(order.id)}</b> · ${money(order.total)}<br>${method === "ecocash" ? "The seller will check your EcoCash payment and deliver." : "Pay cash when your order arrives."}</p>
      ${owned ? "" : `<a class="btn btn-green btn-block" href="${esc(waLink(msg, s.ecocash))}" target="_blank" rel="noopener">Send order to seller on WhatsApp</a>`}
      <button class="btn btn-ghost btn-block" style="margin-top:8px" data-a="close">Keep shopping</button>
      ${owned ? `<p class="mut" style="font-size:12px;margin-top:12px">This order is now in the seller's dashboard → Orders.</p>` : ""}</div>`);
  },
};

/* =========================== RENDER & EVENTS =========================== */
function render() {
  $("#app").innerHTML = ({ landing: vLanding, wizard: vWizard, admin: vAdmin, store: vStore, notfound: vNotFound })[UI.view]();
  document.title = UI.view === "store" ? `${UI.store.name} · LUNA` : UI.view === "admin" ? `${shop().name} · LUNA Admin` : "LUNA";
}
function vNotFound() { return `<div class="wz"><div class="wz-in"><div class="brand"><span class="moon"></span>LUNA</div><h2 style="margin-top:40px">This shop link is incomplete</h2><p class="sub">Ask the seller to send their full store link again.</p><button class="btn btn-gold" data-a="startWizard">Build your own shop</button></div></div>`; }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("submit", (e) => { const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener("change", (e) => {
  if (e.target.dataset.change === "switchShop") { const v = e.target.value; if (v === "__new") return A.startWizard(); DB.current = v; save(); UI.tab = "home"; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "shopname") { UI.wz.name = e.target.value; const nm = e.target.value || "Your Shop"; $("#prevName").textContent = nm; $("#prevUrl").textContent = `${SITE.replace(/^https?:\/\//, "")}/shop/${slugify(e.target.value || "your-shop")}`; $("#namePrev .logo").textContent = initials(nm); const nb = $("[data-a=wzNext]"); if (nb) nb.disabled = e.target.value.trim().length < 2; }
  if (e.target.id === "eco") UI.wz.eco = e.target.value;
  if (e.target.id === "askq") UI.wz.q = e.target.value;
});

function route() {
  const m = location.pathname.match(/\/shop\/([^/?#]+)/), qs = new URLSearchParams(location.search);
  if (m) {
    const slug = decodeURIComponent(m[1]);
    if (DB.shops[slug]) return openStore(DB.shops[slug]);
    if (qs.get("d")) { try { return openStore(unpackShop(slug, b64d(qs.get("d")))); } catch {} }
    UI.view = "notfound"; return render();
  }
  const h = location.hash.slice(1);
  if (h === "admin") { UI.view = "admin"; return render(); }
  if (h === "store") return openStore(shop());
  if (h === "setup") { UI.view = "wizard"; return render(); }
  UI.view = "landing"; render();
}
window.addEventListener("popstate", () => { closeSheet(); route(); });
route();
</script>
</body>
</html>
