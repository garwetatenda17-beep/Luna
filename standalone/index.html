<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUNA</title>
<meta name="description" content="LUNA — build your online shop in 2 minutes. Get paid with EcoCash or cash on delivery.">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: three worlds — a black/gold setup wizard, a white admin dashboard, a bright public storefront. */
:root{
  --ink:#0B0B0C; --ink-2:#17171A; --ink-3:#26262B;
  --gold:#F5B700; --gold-2:#FFD34D; --green:#12B76A; --green-d:#0A8F52; --hot:#FF4D1C;
  --bg:#F5F5F2; --card:#FFFFFF; --line:#E7E6E1; --text:#15171C; --muted:#6A6F78; --soft:#F0EFEA;
  --red:#E5484D; --amber:#B7791F;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-lg:22px;
  --shadow:0 1px 2px rgba(20,20,10,.06), 0 4px 16px rgba(20,20,10,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;text-decoration:none;transition:transform .12s, background .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:#111}
.btn-gold:hover{background:var(--gold-2)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-ghost-dark{background:transparent;border:1px solid #3a3a40;color:#fff}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- WIZARD (black + gold + green) ---------- */
.wz{min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%, rgba(245,183,0,.16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(18,183,106,.14), transparent 60%), var(--ink);color:#fff;padding:20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left))}
.wz-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:18px}
.moon{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #FFE58A, var(--gold) 55%, #C98E00);box-shadow:0 0 24px rgba(245,183,0,.5);position:relative;flex:none}
.moon::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:var(--ink);top:-3px;left:10px}
.hero-h{font-family:var(--display);font-size:clamp(36px,9vw,58px);line-height:1.02;font-weight:800;margin:28px 0 12px;text-wrap:balance;letter-spacing:-.02em}
.hero-h em{font-style:normal;color:var(--gold)}
.wz p.lead{color:#B9B9C0;font-size:17px;max-width:46ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #2f2f35;background:#141417;border-radius:999px;padding:7px 12px;font-size:13px;color:#d8d8de}
.pill b{color:var(--gold)}
.landing-cta{display:grid;gap:10px;margin-top:26px}
.demo-peek{margin-top:34px;border:1px solid #26262c;border-radius:var(--r-lg);overflow:hidden;background:#111114}
.demo-peek .row{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.demo-peek img{aspect-ratio:1;object-fit:cover;width:100%}
.demo-peek .cap{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:#cfcfd6}

.steps{display:flex;gap:6px;margin:22px 0 8px}
.steps i{flex:1;height:5px;border-radius:9px;background:#2a2a30}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--green))}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.wz h2{font-family:var(--display);font-size:32px;line-height:1.08;margin:8px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.wz .sub{color:#A9A9B2;margin:0 0 20px}
.choice-grid{display:grid;gap:12px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;background:#141417;border:1.5px solid #2a2a30;border-radius:18px;padding:18px;color:#fff;transition:border-color .2s, background .2s}
.choice:hover{border-color:#4a4a52}
.choice.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,183,0,.09),rgba(245,183,0,.02))}
.choice .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#1e1e23;flex:none}
.choice b{display:block;font-size:17px}
.choice small{color:#A0A0A8;font-size:13px}
.choice .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid #3a3a42;flex:none}
.choice.on .tick{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 4px #141417}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.city{padding:18px 16px;border-radius:18px;border:1.5px solid #2a2a30;background:#141417;color:#fff;text-align:left}
.city.on{border-color:var(--green);background:linear-gradient(180deg,rgba(18,183,106,.12),rgba(18,183,106,.02))}
.city b{font-family:var(--display);font-size:20px;display:block}
.city small{color:#9d9da6}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:#cfcfd6}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #2c2c33;background:#111114;color:#fff;font-size:16px}
.inp:focus{border-color:var(--gold);outline:none}
.ask{display:flex;gap:8px}
.ask .inp{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{border:1px solid #33333a;background:#151518;color:#ddd;border-radius:999px;padding:7px 12px;font-size:13px}
.chip:hover{border-color:var(--gold);color:#fff}
.verdict{border-radius:20px;overflow:hidden;background:#141417;border:1px solid #2a2a30;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.verdict .top{display:flex;gap:14px;padding:16px}
.verdict .ph{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:none;background:#222}
.verdict .ph.none{display:grid;place-items:center;font-size:34px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-family:var(--display);font-size:22px;letter-spacing:.02em}
.lvl.HOT{color:var(--hot)}
.lvl.GOOD{color:var(--green)}
.lvl.SATURATED{color:#FF5A5F}
.verdict .nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #26262c}
.verdict .nums div{padding:12px 14px;border-right:1px solid #26262c}
.verdict .nums div:last-child{border-right:0}
.verdict .nums small{display:block;color:#8e8e98;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.verdict .nums b{font-size:18px}
.verdict .say{padding:14px 16px;border-top:1px solid #26262c;color:#d7d7de;font-size:14px}
.verdict .say b{color:var(--gold)}
.est{font-size:11px;color:#7d7d86;padding:0 16px 14px}
.preview-card{border-radius:20px;padding:18px;background:linear-gradient(135deg,#1b1b1f,#121214);border:1px solid #2a2a30;display:flex;gap:14px;align-items:center}
.logo{display:grid;place-items:center;border-radius:14px;font-family:var(--display);font-weight:800;color:#111;flex:none}
.wz-nav{display:flex;gap:10px;margin-top:26px}
.wz-nav .btn{padding:15px 20px;font-size:16px}
.done{text-align:center;padding-top:10px}
.done .burst{font-size:64px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.linkbox{display:flex;align-items:center;gap:8px;background:#0f0f12;border:1px dashed #3a3a42;border-radius:14px;padding:12px 14px;margin:16px 0;text-align:left}
.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--gold);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.err{color:#FF8A8A;font-size:13px;margin-top:-6px;margin-bottom:10px}

/* ---------- ADMIN (white, clean) ---------- */
.adm{min-height:100vh;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left))}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.shopid{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.shopid .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green-d);font-weight:600}
.online i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(18,183,106,.6);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,183,106,.55)}80%,100%{box-shadow:0 0 0 7px rgba(18,183,106,0)}}
.shop-switch{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:13px;max-width:170px}
.topbar .shop-switch{display:none}
@media (min-width:640px){.topbar .shop-switch{display:block}.switch-row{display:none!important}}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;padding:12px 16px}
.switch-row .shop-switch{max-width:60%}
.online{white-space:nowrap}
.adm-wrap{max-width:1180px;margin:0 auto;display:flex;gap:24px;padding:18px max(16px, env(safe-area-inset-right)) 110px max(16px, env(safe-area-inset-left))}
.side{display:none}
.main{flex:1;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--green)}
@media (min-width: 920px){
  .tabs{display:none}
  .side{display:block;width:210px;flex:none;position:sticky;top:76px;align-self:flex-start}
  .side .tab{grid-template-columns:24px 1fr;justify-items:start;align-items:center;gap:10px;font-size:14px;padding:10px 12px;width:100%;text-align:left}
  .side .tab.on{background:#fff;box-shadow:var(--shadow)}
  .adm-wrap{padding-bottom:40px}
}
.h1{font-family:var(--display);font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.mut{color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
.sec-h h3{font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:16px}
.stat small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-family:var(--display);font-size:28px;margin-top:6px;letter-spacing:-.01em}
.stat .delta{font-size:12px;color:var(--muted)}
.stat.balance{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.balance small{color:#B9B9C0}
.stat.balance b{color:var(--gold)}
.notice{display:flex;gap:10px;align-items:flex-start;background:#FFF8E1;border:1px solid #F6E2A4;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.notice button{margin-left:auto;flex:none}
.linkcard{padding:16px;display:grid;gap:12px;margin-top:14px}
.urlrow{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px}
.urlrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;gap:14px}
@media (min-width:900px){.grid2{grid-template-columns:1.3fr 1fr}}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.b-green{background:#E3F8EE;color:#08744A}
.b-amber{background:#FFF3D6;color:#8A5A00}
.b-gray{background:#EEEEEA;color:#4c5058}
.b-blue{background:#E6F0FF;color:#1D4ED8}
.b-sample{background:#F3E8FF;color:#6B21A8}
.prod-grid{display:grid;gap:12px}
@media (min-width:640px){.prod-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.prod-grid{grid-template-columns:1fr 1fr 1fr}}
.pcard{display:flex;gap:14px;padding:12px;align-items:center}
.pcard img{width:88px;height:88px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
.pcard .grow{flex:1;min-width:0}
.pcard .t{font-weight:700}
.pcard .price{font-family:var(--display);font-size:20px;font-weight:700}
.pcard .was{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px}
.stock{font-size:13px;color:var(--muted)}
.stock.low{color:var(--red);font-weight:600}
.add-tile{display:grid;place-items:center;gap:6px;border:2px dashed #D4D3CC;border-radius:var(--r);padding:22px;color:var(--muted);background:transparent;font-weight:600;min-height:112px}
.add-tile:hover{border-color:var(--green);color:var(--green-d)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.order{padding:14px 16px;display:grid;gap:10px}
.order .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order .who{font-weight:700}
.order .items{font-size:14px;color:#3a3d44}
.order .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.order .total{font-family:var(--display);font-size:20px;font-weight:700;margin-right:auto}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.promo-hero{border-radius:var(--r-lg);padding:20px;background:linear-gradient(120deg,#FF4D1C,#FF8A00 60%,#F5B700);color:#fff;position:relative;overflow:hidden}
.promo-hero h2{font-family:var(--display);font-size:28px;margin:0 0 4px;line-height:1.05}
.promo-hero p{margin:0;max-width:46ch;opacity:.95}
.promo-hero::after{content:"♪";position:absolute;right:18px;top:6px;font-size:90px;opacity:.18;font-family:var(--display)}
.promo-list{display:grid;gap:12px;margin-top:14px}
@media (min-width:700px){.promo-list{grid-template-columns:1fr 1fr}}
.wallet{border-radius:var(--r-lg);padding:22px;color:#fff;background:radial-gradient(500px 200px at 100% 0%, rgba(245,183,0,.35), transparent 60%), linear-gradient(140deg,#121214,#1f1f24);position:relative;overflow:hidden}
.wallet small{color:#B9B9C0;text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}
.wallet .bal{font-family:var(--display);font-size:44px;font-weight:800;color:var(--gold);margin:4px 0 12px;letter-spacing:-.02em}
.ecocash{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.ecocash .ec{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;font-weight:800;color:#0A4D9C;font-size:12px}
.checklist{padding:6px 0}
.check{display:flex;gap:10px;align-items:center;padding:10px 16px;font-size:14px}
.check i{width:20px;height:20px;border-radius:50%;border:2px solid #CFCEC7;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.check.ok i{background:var(--green);border-color:var(--green)}
.check.ok span{color:var(--muted);text-decoration:line-through}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;color:var(--text);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px, env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-family:var(--display);font-size:22px;margin:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.f{display:grid;gap:6px;margin-bottom:12px}
.f label{font-size:13px;font-weight:600}
.f input,.f textarea,.f select{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px;width:100%}
.f input:focus,.f textarea:focus{border-color:var(--green);outline:none}
.f .hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery button{padding:0;border:2.5px solid transparent;border-radius:12px;overflow:hidden;background:var(--soft)}
.gallery button.on{border-color:var(--green)}
.gallery img{aspect-ratio:1;object-fit:cover;width:100%}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s;max-width:calc(100% - 32px)}

/* ---------- promo video ---------- */
.reel{position:relative;width:min(100%, 330px);aspect-ratio:9/16;margin:0 auto;border-radius:20px;overflow:hidden;background:#000;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.reel .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.3) translate(-3%,-4%)}}
.reel .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.85) 100%)}

.trust{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}

/* ---------- LUNA AI (dark · purple + gold) ---------- */
:root{ --ai-bg:#0D0A17; --ai-2:#171226; --ai-3:#221a38; --ai-line:#2E2547; --violet:#8B5CF6; --violet-2:#B79CFF; --ai-text:#EDE9FE; --ai-mut:#A39BBF; }
.ai{background:radial-gradient(600px 260px at 100% -10%, rgba(139,92,246,.35), transparent 60%), radial-gradient(500px 240px at -10% 110%, rgba(245,183,0,.16), transparent 60%), var(--ai-bg);color:var(--ai-text);border-radius:24px;padding:18px;display:grid;gap:16px}
.ai-head{display:flex;align-items:center;gap:12px}
.orb{width:44px;height:44px;border-radius:50%;flex:none;background:conic-gradient(from 200deg, var(--violet), var(--gold), var(--violet-2), var(--violet));animation:spin 6s linear infinite;position:relative}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff8, transparent 40%), var(--ai-bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-head b{font-family:var(--display);font-size:20px;letter-spacing:.06em}
.ai-head small{display:block;color:var(--ai-mut);font-size:12px}
.bubble{background:var(--ai-3);border:1px solid var(--ai-line);border-radius:18px 18px 18px 6px;padding:14px 16px;font-size:15px;line-height:1.45;max-width:100%}
.bubble .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-violet{background:var(--violet);color:#fff}
.btn-violet:hover{background:#7C4DFF}
.btn-ai-ghost{background:transparent;color:var(--ai-text);border:1px solid var(--ai-line)}
.ai-sec{background:var(--ai-2);border:1px solid var(--ai-line);border-radius:18px;overflow:hidden}
.ai-sec h4{margin:0;padding:14px 16px 4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.ai-sec .sub{padding:0 16px 10px;color:var(--ai-mut);font-size:13px;margin:0}
.acct{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ai-line)}
.pf{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.pf-whatsapp{background:#25D366}.pf-instagram{background:radial-gradient(circle at 30% 110%, #FDCB52, #E1306C 50%, #833AB4)}.pf-tiktok{background:#111;box-shadow:inset -2px 0 0 #FE2C55, inset 2px 0 0 #25F4EE}.pf-facebook{background:#1877F2}
.acct .grow{flex:1;min-width:0}
.acct .t{font-weight:600}
.acct .s{font-size:12px;color:var(--ai-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok-tick{display:inline-flex;align-items:center;gap:6px;color:#4ADE80;font-weight:700;font-size:13px}
.ok-tick i{width:20px;height:20px;border-radius:50%;background:#16A34A;color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.post{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--ai-line);align-items:flex-start}
.post img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.post .grow{flex:1;min-width:0}
.post .txt{font-size:13px;color:#D8D2EE;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.when{font-size:12px;color:var(--gold);font-weight:700;margin-top:4px}
.ai-row{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--ai-line);flex-wrap:wrap}
.ai-row select{flex:1;min-width:0;background:var(--ai-bg);color:var(--ai-text);border:1px solid var(--ai-line);border-radius:12px;padding:11px 12px;font-size:15px}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:999px;border:0;background:#3a3354;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:linear-gradient(90deg,var(--violet),var(--gold))}
.switch.on::after{transform:translateX(22px)}
.ai-note{font-size:12px;color:var(--ai-mut);padding:0 16px 14px}
.sheet.dark{background:var(--ai-2);color:var(--ai-text)}
.sheet.dark .x{background:var(--ai-3);color:#fff}
.sheet.dark .f label{color:var(--ai-text)}
.sheet.dark .f input,.sheet.dark .f textarea{background:var(--ai-bg);color:#fff;border-color:var(--ai-line)}
.consent{text-align:center}
.consent .pair{display:flex;justify-content:center;align-items:center;gap:12px;margin:6px 0 14px}
.consent .pair .pf{width:58px;height:58px;border-radius:16px;font-size:18px}
.consent ul{text-align:left;list-style:none;padding:0;margin:14px 0;display:grid;gap:8px;font-size:14px}
.consent li{display:flex;gap:10px;background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:12px;padding:10px 12px}
.alarm{position:fixed;inset:0;z-index:100;background:radial-gradient(500px 400px at 50% 0%, rgba(139,92,246,.55), transparent 70%), rgba(9,6,17,.96);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px max(18px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));animation:fade .25s}
.alarm-in{width:100%;max-width:440px;display:grid;gap:14px;text-align:center}
.alarm .ring{font-size:56px;animation:ring .5s ease-in-out infinite alternate}
@keyframes ring{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.alarm .clock{font-family:var(--display);font-size:46px;font-weight:800;color:var(--gold);letter-spacing:-.02em}
.alarm .bubble{text-align:left;font-size:17px}
.alarm .pfs{display:flex;justify-content:center;gap:8px}
.alarm .btn{padding:16px;font-size:16px}
.ptask{display:flex;align-items:center;gap:12px;background:var(--ai-2);border:1px solid var(--ai-line);border-radius:14px;padding:12px 14px;text-align:left}
.ptask .grow{flex:1;min-width:0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #ffffff30;border-top-color:var(--gold);animation:spin .8s linear infinite;flex:none}
.done-tick{width:24px;height:24px;border-radius:50%;background:#16A34A;display:grid;place-items:center;font-size:13px;flex:none}
.cloud-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px}
.cloud-on{background:#E3F8EE;color:#08744A}
.cloud-off{background:#EEEEEA;color:#4c5058}
.wait{display:grid;justify-items:center;gap:12px;text-align:center;padding:10px 0}
.wait .spin{width:46px;height:46px;border-width:5px;border-color:#12B76A30;border-top-color:var(--green)}

/* ---------- Whole-app dark theme (purple + gold); the public storefront stays light ---------- */
body.dark{--bg:#0D0A17;--card:#161126;--line:#2C2445;--text:#EDE9FE;--muted:#A39BBF;--soft:#211a36;--shadow:0 1px 0 rgba(255,255,255,.03);background:var(--bg);color:var(--text)}
body.dark .wz{background:radial-gradient(900px 420px at 85% -10%, rgba(139,92,246,.30), transparent 60%), radial-gradient(800px 420px at -10% 110%, rgba(245,183,0,.14), transparent 60%), #0B0814}
body.dark .topbar{background:rgba(13,10,23,.88);border-color:var(--line)}
body.dark .tabs{background:#110d1e;border-color:var(--line)}
body.dark .tab.on svg{color:var(--gold)}
body.dark .side .tab.on{background:var(--card)}
body.dark .seg button{background:var(--card);color:var(--text);border-color:var(--line)}
body.dark .seg button.on{background:var(--violet);border-color:var(--violet);color:#fff}
body.dark .shop-switch,body.dark .f input,body.dark .f textarea,body.dark .f select{background:var(--bg);color:var(--text);border-color:var(--line)}
body.dark .sheet{background:#161126;color:var(--text)}
body.dark .x{background:var(--soft);color:var(--text)}
body.dark .btn-dark{background:#2d2450;color:#fff}
body.dark .stat.balance{background:linear-gradient(140deg,#2a1f4a,#161126);border-color:#3b2f63}
body.dark .gallery button{background:var(--soft)}
body.dark .qty button{background:var(--card);color:var(--text)}
body.dark .pay-opt.on{background:#13261e}
body.dark .notice{background:#29220c;border-color:#5a4a12;color:#f5d27a}
body.dark .add-tile{border-color:#3a3156}
body.dark .online{color:#4ADE80}
body.dark .steps-ec{background:var(--soft)}
.b-violet{background:#2b2147;color:#C4B5FD}
body:not(.dark) .b-violet{background:#EDE9FE;color:#5B21B6}

/* ---------- welcome / location ---------- */
.mode-grid{display:grid;gap:12px;margin-top:26px}
.mode{display:grid;grid-template-columns:56px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:18px;border-radius:20px;border:1.5px solid #3a2f5c;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(20,15,34,.9));color:#fff}
.mode:hover{border-color:var(--gold)}
.mode .ic{grid-row:span 2;width:56px;height:56px;border-radius:16px;background:#1d1631;display:grid;place-items:center;font-size:28px}
.mode b{font-family:var(--display);font-size:22px;letter-spacing:.01em}
.mode small{color:#b9b0d6}
.loc-hero{text-align:center;padding:30px 0 18px}
.loc-hero .pin{font-size:64px;display:inline-block;animation:bounce .7s ease-in-out infinite alternate}
.loc-hero h2{margin-top:10px}
.dark-notice{background:#211a36;border-color:#3b2f63;color:#d9d0f7;margin-bottom:14px}
.linkish{background:none;border:0;padding:0;color:var(--gold);font-weight:700;text-decoration:underline;cursor:pointer}

/* ---------- 3-tap builder ---------- */
.tap{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:16px;border-radius:20px;background:#140f24;border:1.5px solid #2c2445}
.tap.ok{border-color:#4b3a85}
.tap .num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);background:#2a2147;color:var(--gold)}
.tap.ok .num{background:var(--gold);color:#111}
.tap .grow{flex:1;min-width:0}
.tap label{display:block;font-weight:700;margin-bottom:8px}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:560px){.pick-grid{grid-template-columns:repeat(3,1fr)}}
.pick{padding:0;border-radius:16px;overflow:hidden;border:2px solid #2c2445;background:#0f0b1b;color:#fff;text-align:left}
.pick.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,183,0,.2)}
.pick img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pick .pb{padding:10px;display:grid;gap:6px}
.ppp{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:#b9b0d6}
.ppp b{color:#fff}
.ppp .pr{color:#4ADE80;font-weight:700}
.mk{font-size:11px;font-weight:800;letter-spacing:.04em}
.mk.HOT{color:var(--hot)}.mk.GOOD{color:#4ADE80}.mk.SATURATED{color:#FF6B6B}
.btn-ai{background:linear-gradient(100deg,var(--violet),#C084FC 45%,var(--gold));color:#140c26;font-weight:800;padding:16px 18px;font-size:16px;box-shadow:0 10px 30px rgba(139,92,246,.35)}
.btn-ai[disabled]{opacity:.4}

/* ---------- marketing plan ---------- */
.day{padding:12px 16px;border-top:1px solid var(--ai-line);display:grid;gap:8px}
.day .dh{display:flex;align-items:center;gap:10px}
.day .dh b{flex:1;min-width:0}
.day .dn{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:#2a2147;border-radius:999px;padding:3px 8px;white-space:nowrap}
.day .dt{white-space:pre-wrap;font-size:14px;color:#E4DEF7;background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.big-ai{display:block;width:100%;margin-top:14px}

/* ---------- marketplace ---------- */
.dark-pane{display:grid;gap:12px}
.mk-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.loc-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #3b2f63;background:#1a1430;color:#EDE9FE;border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px}
.loc-chip span{color:var(--gold);font-size:12px}
.dark-seg{margin:12px 0 0}
.dark-seg button{background:#1a1430;color:#EDE9FE;border-color:#2c2445}
.dark-seg button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.cmp{background:linear-gradient(135deg,#1d1534,#140f24);border:1px solid #3b2f63;border-radius:18px;padding:14px;display:grid;gap:8px;margin-top:12px}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:14px}
.cmp-row b{font-family:var(--display);font-size:18px}
.range{margin-top:12px}
.range label{font-size:14px}
.range input{width:100%;accent-color:var(--gold);margin:10px 0 6px}
.rticks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   LUNA — AI Store Builder for Zimbabwe. One file. No build step.
   Data: saved in this browser (localStorage). Store links carry the shop's
   products in the URL so customers on other phones can open the real store.
   ========================================================================= */
"use strict";

/* ================== SETTINGS — fill these in to go live ==================
   1. Supabase (free): create a project, run supabase/schema.sql, then copy
      Project Settings → API → Project URL and the "anon public" key here.
   2. Paynow: deploy api/paynow.js on Vercel with your Paynow keys, then set paynow: true.
   Leave them empty and LUNA runs on this phone only (good for testing). */
const LUNA_CONFIG = Object.assign({
  supabaseUrl: "",
  supabaseAnonKey: "",
  paynow: false,
}, window.LUNA_CONFIG_OVERRIDE || {});
const CLOUD = !!(LUNA_CONFIG.supabaseUrl && LUNA_CONFIG.supabaseAnonKey);

/* ---------- Supabase (REST, no library needed) ---------- */
const Cloud = {
  get session() { try { return JSON.parse(localStorage.getItem("luna.session")); } catch { return null; } },
  set session(s) { try { s ? localStorage.setItem("luna.session", JSON.stringify(s)) : localStorage.removeItem("luna.session"); } catch {} },
  get user() { return this.session?.user || null; },
  headers(auth) {
    const tok = auth && this.session?.access_token;
    return { apikey: LUNA_CONFIG.supabaseAnonKey, Authorization: "Bearer " + (tok || LUNA_CONFIG.supabaseAnonKey), "Content-Type": "application/json" };
  },
  async authCall(path, body) {
    const r = await fetch(`${LUNA_CONFIG.supabaseUrl}/auth/v1/${path}`, { method: "POST", headers: this.headers(false), body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "Sign-in failed");
    return j;
  },
  keep(j) { this.session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: { id: j.user?.id, email: j.user?.email } }; },
  async sendCode(email) { await this.authCall("otp", { email, create_user: true }); },
  async verify(email, token) { this.keep(await this.authCall("verify", { type: "email", email, token })); },
  async fresh() {
    const s = this.session; if (!s || s.expires_at - 60000 > Date.now()) return;
    try { this.keep(await this.authCall("token?grant_type=refresh_token", { refresh_token: s.refresh_token })); } catch { this.session = null; }
  },
  signOut() { this.session = null; },
  async rest(path, { method = "GET", body, auth = true, prefer } = {}) {
    if (auth) await this.fresh();
    const h = this.headers(auth); if (prefer) h.Prefer = prefer;
    const r = await fetch(`${LUNA_CONFIG.supabaseUrl}/rest/v1/${path}`, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
    const text = await r.text(); const j = text ? JSON.parse(text) : null;
    if (!r.ok) throw new Error((j && (j.message || j.hint)) || "Server error " + r.status);
    return j;
  },
  rowToProduct: (r) => ({ id: r.id, name: r.name, price: +r.price, was: +r.was || 0, stock: r.stock, img: r.img, desc: r.descr || "" }),
  rowToOrder: (r) => ({ id: r.id, customer: r.customer, phone: r.phone, area: r.area, items: r.items, total: +r.total, method: r.method, ref: r.ref, status: r.status, at: Date.parse(r.created_at) }),
  productRow: (slug, p, i) => ({ id: p.id, shop_slug: slug, name: p.name, price: p.price, was: p.was || 0, stock: p.stock, img: p.img, descr: p.desc || "", position: i ?? 0 }),
  shopFromRow(r, products) {
    const st = r.settings || {};
    return { slug: r.slug, name: r.name, city: r.city, role: r.role, ecocash: r.ecocash, color: r.color, cloud: true, createdAt: Date.parse(r.created_at),
      shared: !!st.shared, promos: st.promos || 0, ai: st.ai, country: st.country || "Zimbabwe", bio: st.bio, pay: st.pay, plan: st.plan, products: (products || []).map(this.rowToProduct), orders: [], views: [], withdrawals: [] };
  },
  async publicShop(slug) {
    const [s] = await this.rest(`shops?slug=eq.${encodeURIComponent(slug)}&select=*`, { auth: false });
    if (!s) return null;
    const ps = await this.rest(`products?shop_slug=eq.${encodeURIComponent(slug)}&select=*&order=position.asc,created_at.asc`, { auth: false });
    const shop = this.shopFromRow(s, ps); shop.visitor = true; return shop;
  },
  async myShops() {
    const rows = await this.rest(`shops?owner=eq.${this.user.id}&select=*&order=created_at.asc`);
    const out = [];
    for (const r of rows) {
      const e = encodeURIComponent(r.slug);
      const [ps, os, ws, vs] = await Promise.all([
        this.rest(`products?shop_slug=eq.${e}&select=*&order=position.asc,created_at.asc`),
        this.rest(`orders?shop_slug=eq.${e}&select=*&order=created_at.desc&limit=200`),
        this.rest(`withdrawals?shop_slug=eq.${e}&select=amt,at`),
        this.rest(`views?shop_slug=eq.${e}&select=at&order=at.desc&limit=5000`),
      ]);
      const s = this.shopFromRow(r, ps);
      s.orders = os.map(this.rowToOrder); s.withdrawals = ws.map((w) => ({ amt: +w.amt, at: Date.parse(w.at) })); s.views = vs.map((v) => Date.parse(v.at));
      out.push(s);
    }
    return out;
  },
  async refreshOrders(s) {
    const e = encodeURIComponent(s.slug);
    const [os, vs] = await Promise.all([this.rest(`orders?shop_slug=eq.${e}&select=*&order=created_at.desc&limit=200`), this.rest(`views?shop_slug=eq.${e}&select=at&order=at.desc&limit=5000`)]);
    return { orders: os.map(this.rowToOrder), views: vs.map((v) => Date.parse(v.at)) };
  },
  settingsOf: (s) => ({ ai: s.ai, shared: !!s.shared, promos: s.promos || 0, country: s.country, bio: s.bio, pay: s.pay, plan: s.plan }),
  async createShop(s) {
    await this.rest("shops", { method: "POST", body: { slug: s.slug, name: s.name, city: s.city, role: s.role, ecocash: s.ecocash, color: s.color, settings: this.settingsOf(s) }, prefer: "return=minimal" });
    if (s.products.length) await this.rest("products", { method: "POST", body: s.products.map((p, i) => this.productRow(s.slug, p, i)), prefer: "return=minimal" });
  },
  saveShop: (s) => Cloud.rest(`shops?slug=eq.${encodeURIComponent(s.slug)}`, { method: "PATCH", body: { name: s.name, ecocash: s.ecocash, settings: Cloud.settingsOf(s) }, prefer: "return=minimal" }),
  saveProduct: (s, p) => Cloud.rest("products?on_conflict=id", { method: "POST", body: [Cloud.productRow(s.slug, p, s.products.indexOf(p))], prefer: "resolution=merge-duplicates,return=minimal" }),
  deleteProduct: (id) => Cloud.rest(`products?id=eq.${encodeURIComponent(id)}`, { method: "DELETE", prefer: "return=minimal" }),
  setOrderStatus: (id, status) => Cloud.rest(`orders?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", body: { status }, prefer: "return=minimal" }),
  addWithdrawal: (s, amt) => Cloud.rest("withdrawals", { method: "POST", body: { shop_slug: s.slug, amt }, prefer: "return=minimal" }),
  addView: (slug) => Cloud.rest("views", { method: "POST", body: { shop_slug: slug }, auth: false, prefer: "return=minimal" }).catch(() => {}),
  placeOrder: (o) => Cloud.rest("orders", { method: "POST", body: o, auth: false, prefer: "return=minimal" }),
};
// Run a cloud write in the background; tell the seller if it didn't save.
function sync(fn) { if (!CLOUD || !shop()?.cloud) return; Promise.resolve().then(fn).catch((e) => toast("⚠️ Not saved online: " + esc(e.message))); }
let settingsT = 0;
function syncSettings(s = shop()) { if (!CLOUD || !s?.cloud) return; clearTimeout(settingsT); settingsT = setTimeout(() => sync(() => Cloud.saveShop(s)), 600); }

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => { n = Math.round((+n || 0) * 100) / 100; return "$" + (Number.isInteger(n) ? n : n.toFixed(2)); };
const uid = () => Math.random().toString(36).slice(2, 7).toUpperCase();
const slugify = (s) => (String(s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "my-shop").slice(0, 40);
const today = (t) => new Date(t).toDateString() === new Date().toDateString();
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "just now"; if (m < 60) return m + " min ago"; const h = Math.round(m / 60); if (h < 24) return h + "h ago"; return Math.round(h / 24) + "d ago"; };
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return ((h >>> 0) % 1000) / 1000; };
const EMBED = window.LUNA_EMBED || {}; // optional inlined images (used only for offline previews)
const src = (u) => { const m = /photo-([\w-]+)\?/.exec(u); return (m && EMBED[m[1]]) || EMBED[u] || u; };

/* ---------- real product photos (Unsplash, every link checked) ---------- */
const PH = (id, w = 900) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=80`;
const PHOTOS = {
  earbuds: "1590658268037-6bf12165a8df", airpods: "1572569511254-d8f925fe2cbb", earbudsRed: "1606220588913-b3aacb4d2f46",
  stand: "1618478594486-c65b899c4936", charger: "1583863788434-e58a36330cf0", magsafe: "1615526675159-e248c3021d3f",
  watch: "1546868871-7041f2a55e12", watchBlue: "1631281956016-3cdc1b2fe5fb", watchWhite: "1523275335684-37898b6baf30",
  headphones: "1505740420928-5e560c06d30e", headphonesW: "1583394838336-acd977736f90", iphone: "1591337676887-a217a6970a8a",
  laptop: "1588872657578-7efd1f1555ed", gamepad: "1606318801954-d46d46d3360a",
  hair: "1519699047748-de8e457a634e", clothes: "1489987707025-afc232f7ea0f", tees: "1562157873-818bc0726f68", sneakers: "1542291026-7eec264c27ff", makeup: "1516975080664-ed2fc6a32937",
};
const GALLERY = Object.entries(PHOTOS).map(([k, id]) => ({ k, url: PH(id) }));

/* ---------- Luna's market guide (estimates per city) ---------- */
const CITIES = [
  { name: "Harare", country: "Zimbabwe", size: 1, note: "Capital · biggest market" },
  { name: "Bulawayo", country: "Zimbabwe", size: 0.55, note: "City of Kings" },
  { name: "Mutare", country: "Zimbabwe", size: 0.32, note: "Eastern border trade" },
  { name: "Lusaka", country: "Zambia", size: 0.8, note: "Cross-border buyers" },
];
const CATALOG = [
  { id: "earphones", name: "Wireless Earphones", photo: "earbuds", supplier: 8, sell: 15, base: 18, keys: ["earphone", "earbud", "airpod", "buds", "bluetooth"] },
  { id: "stand", name: "Phone Holder + Stand", photo: "stand", supplier: 4, sell: 10, base: 14, keys: ["phone holder", "phone stand", "holder", "stand", "tripod"] },
  { id: "charger", name: "Fast Charger + Cable", photo: "charger", supplier: 3, sell: 8, base: 45, keys: ["charger", "cable", "charging", "usb", "type c", "adapter"] },
  { id: "watch", name: "Smart Watch", photo: "watch", supplier: 9, sell: 20, base: 24, keys: ["smart watch", "smartwatch", "watch"] },
  { id: "headphones", name: "Bluetooth Headphones", photo: "headphones", supplier: 12, sell: 25, base: 30, keys: ["headphone", "headset"] },
  { id: "magsafe", name: "Wireless Charging Pad", photo: "magsafe", supplier: 6, sell: 14, base: 16, keys: ["wireless charger", "charging pad", "magsafe"] },
  { id: "gamepad", name: "Game Controller", photo: "gamepad", supplier: 14, sell: 28, base: 20, keys: ["controller", "gamepad", "playstation", "ps5", "ps4", "xbox", "gaming"] },
  { id: "powerbank", name: "Power Bank 20,000mAh", supplier: 10, sell: 20, base: 34, keys: ["power bank", "powerbank"] },
  { id: "solar", name: "Solar Lamps & Panels", supplier: 12, sell: 25, base: 22, keys: ["solar", "lamp", "zesa", "load shedding", "power cut", "light"] },
  { id: "cases", name: "Phone Cases & Screen Guards", supplier: 2, sell: 6, base: 95, keys: ["phone case", "case", "cover", "screen guard", "protector"] },
  { id: "wigs", name: "Wigs & Hair Extensions", supplier: 15, sell: 28, base: 220, keys: ["wig", "weave", "braid", "hair", "lace", "bundles", "brazilian"] },
  { id: "sneakers", name: "Sneakers", supplier: 18, sell: 30, base: 140, keys: ["sneaker", "shoe", "trainer", "air force", "jordan", "nike"] },
  { id: "perfume", name: "Perfumes", supplier: 6, sell: 15, base: 110, keys: ["perfume", "fragrance", "cologne", "body spray"] },
  { id: "skincare", name: "Skincare & Lotions", supplier: 4, sell: 9, base: 85, keys: ["skincare", "lotion", "cream", "makeup", "beauty", "cosmetic"] },
  { id: "dresses", name: "Ladies' Dresses", supplier: 7, sell: 16, base: 160, keys: ["dress", "clothes", "clothing", "fashion", "outfit"] },
  { id: "baby", name: "Baby Clothes", supplier: 5, sell: 12, base: 40, keys: ["baby", "kids", "children", "newborn"] },
  { id: "bags", name: "Handbags & Backpacks", supplier: 8, sell: 18, base: 60, keys: ["bag", "handbag", "backpack", "purse"] },
];
function askLuna(text, cityName) {
  const q = String(text || "").toLowerCase().trim();
  if (!q) return null;
  const city = CITIES.find((c) => c.name === cityName) || CITIES[0];
  let best = null, score = 0;
  for (const p of CATALOG) { let s = 0; for (const k of p.keys) if (new RegExp("\\b" + k).test(q)) s += k.length; if (s > score) { score = s; best = p; } }
  if (!best) {
    return { known: false, name: text.trim().slice(0, 40), level: "GOOD", sellers: Math.round(4 + 10 * hash(q + city.name)), city: city.name,
      say: `Luna hasn't seen many sellers of <b>${esc(text.trim())}</b> in ${esc(city.name)} yet — that's usually a good sign. Test it with 3–5 pieces before you buy more.` };
  }
  const sellers = Math.max(3, Math.round(best.base * city.size * (0.75 + 0.5 * hash(city.name + best.id))));
  const level = sellers < 30 ? "HOT" : sellers < 90 ? "GOOD" : "SATURATED";
  const keep = Math.max(1, Math.round((best.sell - best.supplier) * 0.7));
  let say;
  if (level === "HOT") say = `🔥 <b>Few sellers, lots of buyers</b> in ${esc(city.name)}. Great pick — list it today.`;
  else if (level === "GOOD") say = `🟢 <b>Healthy market.</b> Stand out with clear photos, fast delivery and EcoCash.`;
  else {
    const alt = CATALOG.filter((p) => p.photo).map((p) => ({ p, s: Math.round(p.base * city.size * (0.75 + 0.5 * hash(city.name + p.id))) })).sort((a, b) => a.s - b.s)[0].p;
    say = `🔴 <b>Too many sellers</b> in ${esc(city.name)} — prices get pushed down. Try <b>${esc(alt.name)}</b> instead.`;
  }
  return { known: true, product: best, level, sellers, keep, city: city.name, say };
}

/* ---------- data ---------- */
const KEY = "luna.store.v1";
const DEMO_SLUG = "luna-demo-store-harare";
const ORDER_STATES = { awaiting: "To confirm", paid: "To deliver", cod: "To deliver", delivered: "Delivered" };
function demoShop() {
  const now = Date.now();
  const products = [
    { id: "p1", name: "Wireless Earphones Pro", price: 15, was: 22, stock: 24, img: PH(PHOTOS.earbuds), desc: "True wireless Bluetooth 5.3 earbuds with charging case. 24h battery, deep bass, works with Android & iPhone." },
    { id: "p2", name: "Phone Holder + Stand", price: 10, was: 14, stock: 40, img: PH(PHOTOS.stand), desc: "Adjustable desk stand for phones and small tablets. Perfect for video calls, TikTok and watching in kombis." },
    { id: "p3", name: "Fast Charger 20W + Cable", price: 8, was: 12, stock: 35, img: PH(PHOTOS.charger), desc: "20W USB-C fast charger with 1m cable. Charges to 50% in 30 minutes. Safe for all phones." },
    { id: "p4", name: "Smart Watch Series X", price: 20, was: 30, stock: 3, img: PH(PHOTOS.watch), desc: "Calls, WhatsApp alerts, steps, heart rate and sleep. 7-day battery. Black strap." },
  ];

const PLATFORMS = [
  { k: "whatsapp", name: "WhatsApp Status", short: "WhatsApp", tag: "WA", ask: "Your WhatsApp number" },
  { k: "instagram", name: "Instagram", short: "Instagram", tag: "IG", ask: "Your Instagram @username" },

const dstr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); };
const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const fmtTime = (hm) => { const [h, m] = hm.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const fmtWhen = (p) => `${p.date === dstr() ? "Today" : p.date === addDays(1) ? "Tomorrow" : new Date(p.date + "T12:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })} ${fmtTime(p.time)}`;
function ensureAI(s) {
  if (!s.country) s.country = "Zimbabwe";
  s.ai = Object.assign({ social: {}, posts: [], reminderTime: "10:00", autoMode: false, connectSeen: false }, s.ai || {});
  s.ai.posts = s.ai.posts.filter((p) => p.date >= addDays(-7));
  if (s.demo && !s.ai.seeded && s.products.length) { s.ai.seeded = true; queuePost(s, s.products[0]); }
  return s.ai;
}
const tagify = (w) => "#" + String(w).replace(/[^A-Za-z0-9]/g, "");
function writePosts(s, p, seed) {
  const link = shareUrl(s), city = s.city, short = p.name.split(" ").slice(0, 2).join(" ");
  const hooks = [`POV: you found ${p.name} for ${money(p.price)} in ${city} 😳`, `Stop scrolling 🛑 ${p.name} deal in ${city}`, `${city}, this one is for you 🔥`, `Your sign to upgrade your ${short.toLowerCase()} 👀`];
  const hook = hooks[Math.floor(hash(seed + p.id) * hooks.length)];
  const save = p.was > p.price ? ` (was ${money(p.was)})` : "";
  const first = (p.desc || "").split(/(?<=\.)\s/)[0] || `Quality ${p.name.toLowerCase()} delivered fast.`;
  const tags = [city, "Zimbabwe", "Zim", city + "Deals", "EcoCash", "ShopLocal", ...p.name.split(" ").slice(0, 2)].map(tagify).join(" ");
  return {
    whatsapp: `🔥 ${p.name} — only ${money(p.price)}${save}!\n${first}\n🚚 Delivery in ${city} · 💚 EcoCash or pay on delivery\n👉 Order here: ${link}`,
    instagram: `${hook}\n\n✅ ${first}\n💵 ${money(p.price)}${save}\n🚚 Fast delivery in ${city}\n💚 Pay with EcoCash or cash on delivery\n\nTap the link in our bio or DM “ORDER” 📩\n\n${tags}`,
    tiktok: `🎬 6-second video\n0–2s: Close-up of the ${p.name.toLowerCase()} · text: “${hook}”\n2–4s: Show it in use · text: “Only ${money(p.price)} in ${city}”\n4–6s: Your store link on screen · text: “Order now · EcoCash”\n🎵 Sound: trending Amapiano beat\n\nCaption: ${hook} ${money(p.price)} only 🔥 Link in bio · ${tags}`,
    facebook: `${hook}\n\n${p.name} now available at ${s.name} for just ${money(p.price)}${save}.\n${first}\n\n✔️ Delivery anywhere in ${city}\n✔️ Pay with EcoCash or cash when it arrives\n\nOrder online in 1 minute 👉 ${link}`,
  };
}
// Next free slot at the reminder time: today if it hasn't passed, else tomorrow.
function nextSlot(s) { const t = s.ai.reminderTime; return nowHM() < t ? { date: dstr(), time: t } : { date: addDays(1), time: t }; }
function queuePost(s, p, slot, auto) {
  slot = slot || nextSlot(s);
  s.ai.posts = s.ai.posts.filter((x) => !(x.date === slot.date && x.status === "scheduled"));
  const post = { id: "post" + uid(), pid: p.id, ...slot, status: "scheduled", auto: !!auto, texts: writePosts(s, p, slot.date), done: {}, alarmed: false };
  s.ai.posts.push(post); s.ai.posts.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return post;
}
// Auto Mode: always have today's (if still ahead) and tomorrow's post ready, rotating products.
function autoPrepare(s) {
  if (!s.ai?.autoMode || !s.products.length) return false;
  let changed = false;
  for (const off of [0, 1]) {
    const date = addDays(off);
    if (off === 0 && nowHM() >= s.ai.reminderTime) continue;
    if (s.ai.posts.some((x) => x.date === date)) continue;
    const day = Math.floor(new Date(date + "T12:00").getTime() / 864e5);
    queuePost(s, s.products[day % s.products.length], { date, time: s.ai.reminderTime }, true); changed = true;
  }
  return changed;
}

/* ---------- metrics (computed from real orders & visits) ---------- */
function metrics(s) {
  const paid = s.orders.filter((o) => o.status === "paid" || o.status === "delivered");
  const todays = s.orders.filter((o) => today(o.at));
  return {
    salesToday: paid.filter((o) => today(o.at)).reduce((a, o) => a + o.total, 0),
    ordersToday: todays.length,
    pending: s.orders.filter((o) => ["awaiting", "paid", "cod"].includes(o.status)).length,
    viewsToday: s.views.filter(today).length,
    viewsAll: s.views.length,
    balance: paid.reduce((a, o) => a + o.total, 0) - s.withdrawals.reduce((a, w) => a + w.amt, 0),
    hasSamples: s.orders.some((o) => o.sample),
  };
}

/* ----- Alarm: sound + vibration + notification ----- */
let ALARM = null;
function ringStart() {
  const AC = window.AudioContext || window.webkitAudioContext;
  const st = { stop: false, ac: AC ? new AC() : null };
  const beep = () => {
    if (st.stop) return;
    if (st.ac) { const t = st.ac.currentTime; [0, 0.18, 0.36].forEach((dt, i) => { const o = st.ac.createOscillator(), g = st.ac.createGain(); o.type = "square"; o.frequency.value = i === 1 ? 1175 : 880; g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.18, t + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.15); o.connect(g).connect(st.ac.destination); o.start(t + dt); o.stop(t + dt + 0.16); }); }
    navigator.vibrate?.([300, 120, 300, 120, 600]);
  };
  beep(); st.iv = setInterval(beep, 1600); st.end = setTimeout(() => ringStop(st), 90000);
  return st;
}
function ringStop(st) { if (!st) return; st.stop = true; clearInterval(st.iv); clearTimeout(st.end); navigator.vibrate?.(0); st.ac?.close().catch(() => {}); }
function showAlarm(post) {
  const s = shop(), p = s.products.find((x) => x.id === post.pid);
  if (!p) return;
  post.alarmed = true; save();
  closeAlarm();
  ALARM = { post, ring: ringStart() };
  const msg = `LUNA AI: Ready to post today's ${p.name} deal to WhatsApp, Instagram, TikTok, Facebook? Should I post now?`;
  if (document.hidden && "Notification" in window && Notification.permission === "granted") { try { const n = new Notification("LUNA AI ⏰", { body: msg, tag: "luna-" + post.id, requireInteraction: true }); n.onclick = () => { window.focus(); n.close(); }; } catch {} }
  const box = document.createElement("div"); box.id = "alarm";
  box.innerHTML = `<div class="alarm" role="alertdialog" aria-modal="true" aria-label="LUNA AI reminder"><div class="alarm-in">
    <div class="ring">⏰</div><div class="clock tnum">${fmtTime(nowHM())}</div>
    <div class="ai-head" style="justify-content:center"><span class="orb"></span><b>LUNA AI</b></div>
    <div class="bubble"><b style="color:var(--gold)">LUNA AI:</b> Ready to post today's <b>${esc(p.name)}</b> deal (${money(p.price)}) to WhatsApp, Instagram, TikTok, Facebook? Should I post now?</div>
    <img src="${esc(src(p.img))}" alt="" style="width:100%;max-height:190px;object-fit:cover;border-radius:16px">
    <div class="pfs">${PLATFORMS.map((x) => pfBadge(x.k)).join("")}</div>
    <button class="btn btn-gold btn-block" data-a="postNow" data-id="${esc(post.id)}">YES, POST NOW</button>

async function sendTo(k) {
  const { post, p, file } = UI.posting, s = shop(), text = post.texts[k], link = shareUrl(s);
  try { await navigator.clipboard?.writeText(text); } catch {}
  let opened = false;

  } catch (e) { if (e.name === "AbortError") return; }
  if (!opened) {
    const url = { whatsapp: `https://wa.me/?text=${encodeURIComponent(text)}`, instagram: "https://www.instagram.com/", tiktok: "https://www.tiktok.com/upload", facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}&quote=${encodeURIComponent(text)}` }[k];

let MUSIC = null;
function beat(ac, out, t0, secs) {
  const bpm = 120, b = 60 / bpm, bass = [55, 55, 65.41, 73.42];
  const noise = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  for (let i = 0; i * b < secs; i++) {
    const t = t0 + i * b;
    const k = ac.createOscillator(), kg = ac.createGain(); k.frequency.setValueAtTime(150, t); k.frequency.exponentialRampToValueAtTime(40, t + 0.15); kg.gain.setValueAtTime(0.9, t); kg.gain.exponentialRampToValueAtTime(0.001, t + 0.2); k.connect(kg).connect(out); k.start(t); k.stop(t + 0.22);
    const h = ac.createBufferSource(), hf = ac.createBiquadFilter(), hg = ac.createGain(); h.buffer = noise; hf.type = "highpass"; hf.frequency.value = 7000; hg.gain.setValueAtTime(0.25, t + b / 2); hg.gain.exponentialRampToValueAtTime(0.001, t + b / 2 + 0.05); h.connect(hf).connect(hg).connect(out); h.start(t + b / 2); h.stop(t + b / 2 + 0.06);
    const o = ac.createOscillator(), og = ac.createGain(), f = ac.createBiquadFilter(); o.type = "sawtooth"; o.frequency.value = bass[Math.floor(i / 2) % 4]; f.type = "lowpass"; f.frequency.value = 500; og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.22, t + 0.02); og.gain.exponentialRampToValueAtTime(0.001, t + b * 0.9); o.connect(f).connect(og).connect(out); o.start(t); o.stop(t + b);
    if (i % 4 === 0) [440, 554.37, 659.25].forEach((fr) => { const c = ac.createOscillator(), cg = ac.createGain(); c.type = "triangle"; c.frequency.value = fr; cg.gain.setValueAtTime(0.06, t); cg.gain.exponentialRampToValueAtTime(0.001, t + 0.4); c.connect(cg).connect(out); c.start(t); c.stop(t + 0.42); });
  }
}
function stopMusic() { if (MUSIC) { clearInterval(MUSIC.iv); MUSIC.ac.close(); MUSIC = null; } const b = $("#musicBtn"); if (b) b.textContent = "▶ Play with music"; }
function toggleMusic() {
  if (MUSIC) return stopMusic();
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return toast("Music isn't supported on this browser");
  const ac = new AC(); const out = ac.createGain(); out.gain.value = 0.7; out.connect(ac.destination);
  let next = ac.currentTime + 0.05; beat(ac, out, next, 6); next += 6;
  MUSIC = { ac, iv: setInterval(() => { if (ac.currentTime > next - 1.5) { beat(ac, out, next, 6); next += 6; } }, 400) };
  $("#musicBtn").textContent = "■ Stop music";
}
function loadImg(url) { return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
function drawPromo(ctx, W, H, t, img, p, s) {

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.72)); };
    img.onerror = rej; img.src = url;
  });
}

  if (/supplier|stock|wholesale|buy from/.test(low)) { const k = c?.k || UI.mk?.cat || "earphones"; return `Closest ${cat(k).name.toLowerCase()} suppliers that deliver to ${me.city}:\n${near(k) || "None yet — try All Africa in Suppliers."}\nAlways chat on WhatsApp first and pay 50% now, 50% after tracking.`; }
  if (/post|caption|status|tiktok|facebook|market/.test(low)) { const s = shop(); return s ? `Here's a WhatsApp Status for today:\n\n${planTemplate(s)[0]}\n\nTap “Market My Business For Me” in Luna AI for a full 7-day plan.` : "Open your shop first, then I'll write your posts."; }

User: ${me.mode || "seller"} in ${me.city}, ${me.country}. Payments there: ${payOf(me.country || "Zimbabwe").join(", ")}.${s ? ` Their shop: ${s.name}, selling ${s.products.map((p) => `${p.name} at ${money(p.price)}`).join(", ")}. Store link: ${shareUrl(s)}` : ""}

Safety rule to repeat when suppliers come up: chat on WhatsApp first, pay 50% now and 50% after tracking on a first order.

Conversation:

Luna:`;

  view(`<span class="spin"></span><h3>Sending EcoCash request…</h3>`);
  let r;
  try { r = await (await fetch("/api/paynow", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "initiate", orderId: order.id, phone: wallet }) })).json(); }
  catch { r = { ok: false, error: "Can't reach the payment server." }; }
  if (!r.ok) return view(`<div style="font-size:46px">⚠️</div><h3>Payment didn't start</h3><p class="mut">${esc(r.error || "Try again.")}<br>Your order <b>${esc(order.id)}</b> is saved — the seller can still deliver and collect cash.</p><button class="btn btn-ghost btn-block" data-a="close">Close</button>`);
  view(`<span class="spin"></span><h3>Check your phone 📱</h3><p class="mut">${esc(r.instructions || "Enter your EcoCash PIN to pay " + money(order.total) + ".")}</p><p class="mut tnum" id="payWait" style="font-size:13px">Waiting for your PIN…</p>`);
  const t0 = Date.now();
  while (Date.now() - t0 < 180000 && $("#payWait")) {
    await new Promise((res) => setTimeout(res, 4000));
    let st; try { st = await (await fetch(`/api/paynow?action=status&id=${encodeURIComponent(order.id)}`)).json(); } catch { continue; }
    if (st.status === "paid") { order.status = "paid"; return orderDone(order, true); }
    if (st.status === "payment_failed") return view(`<div style="font-size:46px">❌</div><h3>Payment cancelled</h3><p class="mut">EcoCash didn't go through. You can try again or choose Pay on Delivery.</p><button class="btn btn-ghost btn-block" data-a="close">Close</button>`);
    const el = $("#payWait"); if (el) el.textContent = `Still waiting… ${Math.round((Date.now() - t0) / 1000)}s`;
  }
  if ($("#payWait")) view(`<div style="font-size:46px">⏳</div><h3>No PIN yet</h3><p class="mut">If you paid, the seller will see it shortly. Order <b>${esc(order.id)}</b>.</p><button class="btn btn-ghost btn-block" data-a="close">Close</button>`);
}

const FORMS = {
  async supreg(f) {
    const me = DB.me, c = f.country.value, city = f.city.value, k = f.cat.value, price = +f.price.value;
    const ships = [...f.querySelectorAll("input[name=ships]:checked")].map((x) => x.value);
    const wa = intl(f.whatsapp.value, c);
    if (f.name.value.trim().length < 2) return toast("Enter your business name");
    if (!(price > 0)) return toast("Enter your wholesale price");
    if (!/^\d{9,15}$/.test(wa)) return toast("Enter your WhatsApp number");
    const ll = f.gps?.checked && me.how === "gps" && c === me.country ? meLL() : cityLL(c, city);
    const sup = { name: f.name.value.trim(), country: c, city, lat: ll[0], lng: ll[1], cat: k, productName: f.productName.value.trim() || cat(k).name, price, ships: ships.length ? ships : [c], days: +f.days.value || 0, whatsapp: wa, photo: UI.sr?.photo || "", rating: 0, sales: 0, verified: false, createdAt: Date.now() };
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Going live…";
    let sharedOk = false;
    if (Shared.db && Shared.uid) { try { await Shared.saveSupplier(sup); sharedOk = true; } catch (e) { toast("⚠️ Couldn't share: " + esc(e.message || e.code || "")); } }
    if (!sharedOk) DB.mySuppliers = [{ ...sup, id: "my-" + uid() }];
    save(); log("supplier_registered", `${sup.name} · ${cat(k).name} · ${city}`);
    UI.sr = null; UI.mk = { cat: k, range: 5 };
    toast(sharedOk ? "✅ You're live — every LUNA tester can see you now" : "✅ You're live on this phone");
    const b = UI.srBack || (me.mode === "supplier" ? "market" : "admin"); if (b === "admin") UI.tab = "suppliers"; go(b, b);
  },
  report(f) {
    const id = f.dataset.id, reason = f.reason.value, note = f.note.value.trim();
    DB.hiddenSup = [...(DB.hiddenSup || []), id]; save();
    Shared.report({ id, reason, note, at: Date.now() }).catch(() => {});
    log("report", `${reason} · ${id}`); closeSheet(); render(); toast("Thanks — LUNA will review this supplier. Hidden for you.");
  },
  chat(f) { chatSend(f.q.value); },
  ask(f) { UI.wz.q = f.q.value; UI.wz.v = askLuna(f.q.value, UI.wz.city); render(); },
  name() { A.wzNext(); },
  product(f) {
    const s = shop(), id = f.dataset.id, url = f.url.value.trim();
    if (url && !/^https:\/\/\S+$/.test(url)) return toast("Image link must start with https://");
    const data = { name: f.name.value.trim(), price: +f.price.value, was: +f.was.value || 0, stock: Math.max(0, Math.round(+f.stock.value)), desc: f.desc.value.trim(), img: url || UI.pickImg };
    let prod; if (id) prod = Object.assign(s.products.find((p) => p.id === id), data); else s.products.push((prod = { id: "p" + uid() + uid(), ...data }));
    save(); sync(() => Cloud.saveProduct(s, prod)); closeSheet(); render(); toast(id ? "✓ Saved" : "✓ Product added to your store");
  },
  consent(f) {
    const s = shop(), k = f.dataset.k, pf = PLATFORMS.find((x) => x.k === k);
    s.ai.social[k] = { handle: f.handle.value.trim(), at: Date.now() }; save(); syncSettings(s);
    if (UI.consentBack) sheetConnectAll(); else closeSheet();
    render(); toast(`✓ ${pf.short} connected`);
  },
  editPost(f) {
    const s = shop(), post = s.ai.posts.find((x) => x.id === f.dataset.id);
    PLATFORMS.forEach((p) => (post.texts[p.k] = f[p.k].value));
    if (post.time !== f.time.value) { post.time = f.time.value; post.alarmed = false; }
    save(); syncSettings(s); closeSheet(); render(); toast("✓ Post saved");
  },
  reminder(f) {
    const s = shop(), t = f.time.value; s.ai.reminderTime = t;
    s.ai.posts.forEach((x) => { if (x.status === "scheduled" && !x.alarmed && x.date >= dstr()) x.time = t; });
    autoPrepare(s); save(); syncSettings(s); closeSheet(); render(); toast(`⏰ LUNA will ask you at ${fmtTime(t)}`);
  },
  async signin(f) {
    const email = f.email.value.trim(), btn = f.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      if (!UI.signinEmail) { await Cloud.sendCode(email); UI.signinEmail = email; return sheetSignin(); }
      await Cloud.verify(UI.signinEmail, f.code.value.trim()); UI.signinEmail = null;
      await loadCloudShops(); closeSheet();
      if (UI.afterSignin) { const next = UI.afterSignin; UI.afterSignin = null; return next(); }
      const mine = Object.values(DB.shops).filter((x) => x.cloud);
      if (!mine.length) { toast("No shop yet — let's build one"); return A.startWizard(); }
      DB.current = mine[0].slug; save(); UI.tab = "home"; go("admin", "admin");
    } catch (e) { btn.disabled = false; toast("⚠️ " + esc(e.message)); }
  },
  async code(f) { UI.wz.code = f.code.value.trim(); await A.wzNext(); },
  eco(f) { const d = f.eco.value.replace(/\D/g, ""); if (!/^\d{9,13}$/.test(d)) return toast("Enter your mobile money number"); shop().ecocash = d; save(); syncSettings(); closeSheet(); render(); toast("✓ EcoCash number saved"); },
  withdraw(f) { const s = shop(), amt = Math.min(+f.amt.value, metrics(s).balance); if (!(amt > 0)) return; s.withdrawals.push({ amt, at: Date.now() }); save(); sync(() => Cloud.addWithdrawal(s, amt)); closeSheet(); render(); toast(`✓ ${money(amt)} withdrawal recorded`); },
  async checkout(f) {
    const s = UI.store, method = UI.payMethod || "ecocash", btn = $("#payBtn");
    const phone = f.phone.value.replace(/\D/g, "");
    if (!/^\d{9,13}$/.test(phone)) return toast("Enter your phone number");
    const wallet = method === "paynow" ? f.wallet.value.replace(/\D/g, "") : "";
    if (method === "paynow" && !/^07[78]\d{7}$/.test(wallet)) return toast("Enter an EcoCash number starting 077 or 078");
    const items = UI.cart.map((c) => { const p = s.products.find((x) => x.id === c.id); return { pid: p.id, name: p.name, qty: c.qty, price: p.price }; });
    const order = { id: "LN-" + uid() + uid().slice(0, 2), customer: f.name.value.trim(), phone, area: f.area.value.trim() + ", " + s.city, items, total: cartTotal(), method, ref: method === "ecocash" ? f.ref.value.trim() : "", status: method === "ecocash" ? "awaiting" : method === "cod" ? "cod" : "pending_paynow", at: Date.now() };
    const live = CLOUD && s.cloud, owned = !s.visitor && DB.shops[s.slug];
    btn.disabled = true; btn.textContent = "Placing order…";
    if (live) {
      try { await Cloud.placeOrder({ id: order.id, shop_slug: s.slug, customer: order.customer, phone, area: order.area, items: items.map((i) => ({ pid: i.pid, qty: i.qty })), method, ref: order.ref }); }
      catch (e) { btn.disabled = false; btn.textContent = "Try again"; return toast("⚠️ " + esc(e.message)); }
      items.forEach((i) => { const p = s.products.find((x) => x.id === i.pid); p.stock = Math.max(0, p.stock - i.qty); });
      if (owned) { owned.orders.unshift(order); save(); }
    } else if (owned) { s.orders.push(order); items.forEach((i) => { const p = s.products.find((x) => x.id === i.pid); p.stock = Math.max(0, p.stock - i.qty); }); save(); }
    UI.cart = []; render(); log("order", `${money(order.total)} · ${method} · ${s.name}`);
    if (method === "paynow") return payWithPaynow(order, wallet);
    orderDone(order, live || owned);
  },
};

/* =========================== RENDER & EVENTS =========================== */
function render() {
  $("#app").innerHTML = ({ landing: vWelcome, welcome: vWelcome, locate: vLocate, build3: vBuild3, supreg: vSupReg, market: vMarket, monitor: vMonitor, wizard: vWizard, admin: vAdmin, store: vStore, notfound: vNotFound, loading: () => `<div class="wz"><div class="wz-in" style="padding-top:30vh;text-align:center"><div class="brand" style="justify-content:center"><span class="moon"></span>LUNA</div><p class="sub" style="margin-top:14px">Opening store…</p></div></div>` })[UI.view]();
  $("#app").insertAdjacentHTML("beforeend", chatFab());
  document.body.classList.toggle("dark", UI.view !== "store");
  if (UI.view === "admin" && !ensureAI(shop()).connectSeen) setTimeout(() => { if (UI.view === "admin" && !shop().ai.connectSeen && !$("#sheet .scrim") && !$("#alarm")) sheetConnectAll(); }, 500);
  document.title = UI.view === "store" ? `${UI.store.name} · LUNA` : UI.view === "admin" ? `${shop().name} · LUNA Admin` : "LUNA";
}
function vNotFound() { return `<div class="wz"><div class="wz-in"><div class="brand"><span class="moon"></span>LUNA</div><h2 style="margin-top:40px">This shop link is incomplete</h2><p class="sub">Ask the seller to send their full store link again.</p><button class="btn btn-gold" data-a="startWizard">Build your own shop</button></div></div>`; }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("submit", (e) => { const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener("change", (e) => {
  const ch = e.target.dataset.change;
  if (ch === "locCountry") { UI.loc.country = e.target.value; UI.loc.city = Object.keys(country(e.target.value).cities)[0]; return render(); }
  if (ch === "locCity") { UI.loc.city = e.target.value; return; }
  if (ch === "mkRange") { UI.mk.range = +e.target.value; return render(); }
  if (ch === "srCountry") { UI.sr = readSupForm(); UI.sr.city = Object.keys(country(UI.sr.country).cities)[0]; return render(); }
  if (e.target.id === "srFile" && e.target.files[0]) { shrinkPhoto(e.target.files[0]).then((d) => { UI.sr = { ...readSupForm(), photo: d }; $("#srImg").src = d; }).catch(() => toast("Couldn't read that photo")); return; }
  if (e.target.name === "ships") { e.target.closest(".shp")?.classList.toggle("on", e.target.checked); return; }
  if (e.target.dataset.change === "switchShop") { const v = e.target.value; if (v === "__new") return A.startWizard(); DB.current = v; save(); UI.tab = "home"; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "shopname") { UI.wz.name = e.target.value; const nm = e.target.value || "Your Shop"; $("#prevName").textContent = nm; $("#prevUrl").textContent = `${SITE.replace(/^https?:\/\//, "")}/shop/${slugify(e.target.value || "your-shop")}`; $("#namePrev .logo").textContent = initials(nm); const nb = $("[data-a=wzNext]"); if (nb) nb.disabled = e.target.value.trim().length < 2; }
  if (e.target.id === "eco") UI.wz.eco = e.target.value;
  if (e.target.id === "b3name") { UI.b3.name = e.target.value; const ok = e.target.value.trim().length >= 2; e.target.closest(".tap").classList.toggle("ok", ok); const b = $("[data-a=build3]"); if (b) b.disabled = !(ok && UI.b3.cat); }
  if (e.target.id === "askq") UI.wz.q = e.target.value;
});

async function route() {
  const m = location.pathname.match(/\/shop\/([^/?#]+)/), qs = new URLSearchParams(location.search);
  if (m) {
    const slug = decodeURIComponent(m[1]);
    if (DB.shops[slug]) return openStore(DB.shops[slug]);
    if (CLOUD) {
      UI.view = "loading"; render();
      try { const ps = await Cloud.publicShop(slug); if (ps) return openStore(ps); } catch {}
    }
    if (qs.get("d")) { try { return openStore(unpackShop(slug, b64d(qs.get("d")))); } catch {} }
    UI.view = "notfound"; return render();
  }
  const h = location.hash.slice(1);
  if (h === "admin") { UI.view = "admin"; return render(); }
  if (h === "store") return openStore(shop());
  if (h === "setup") { UI.view = "wizard"; return render(); }
  if (h === "monitor") return openMonitor();
  if (["market", "build3", "supreg", "locate"].includes(h) && DB.me) { UI.view = h; return render(); }
  UI.view = homeView(); render();
}
async function loadCloudShops() {
  const list = await Cloud.myShops();
  list.forEach((x) => { ensureAI(x); DB.shops[x.slug] = x; });
  if (!DB.shops[DB.current]) DB.current = list[0]?.slug || DEMO_SLUG;
  save();
}
function chime() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [659.25, 987.77].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; const t = ac.currentTime + i * 0.14; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.4); }); setTimeout(() => ac.close(), 900); } catch {}
  navigator.vibrate?.(200);
}
async function pollOrders() {
  const s = shop(); if (!CLOUD || !s?.cloud || !Cloud.user || document.hidden || !["admin", "store"].includes(UI.view)) return;
  try {
    const r = await Cloud.refreshOrders(s), known = new Set(s.orders.map((o) => o.id));
    const fresh = r.orders.filter((o) => !known.has(o.id));
    const changed = fresh.length || r.views.length !== s.views.length || JSON.stringify(r.orders.map((o) => o.status)) !== JSON.stringify(s.orders.map((o) => o.status));
    s.orders = r.orders; s.views = r.views; save();
    if (fresh.length) { toast(`🛍️ New order from ${esc(fresh[0].customer)} — ${money(fresh[0].total)}`); chime(); }
    if (changed && UI.view === "admin") render();
  } catch {}
}
function sheetSignin() {
  const e = UI.signinEmail;
  openSheet(`<div class="sheet-h"><h3>Sign in to your shop</h3><button class="x" data-a="close" aria-label="Close">×</button></div>
    <form data-form="signin">${e ? `<p class="mut" style="margin-top:0">We emailed a code to <b>${esc(e)}</b>.</p><input type="hidden" name="email" value="${esc(e)}"><div class="f"><label for="sc">Code</label><input id="sc" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" style="font-size:24px;letter-spacing:.3em"></div>`
      : `<div class="f"><label for="se">Email</label><input id="se" name="email" type="email" autocomplete="email" required></div>`}
    <button class="btn btn-green btn-block" type="submit">${e ? "Sign in" : "Email me a code"}</button></form>`);
}
async function boot() {
  Shared.init(); log("open");
  await route();
  if (CLOUD && Cloud.user) { try { await loadCloudShops(); if (UI.view === "admin") render(); } catch {} }
  setInterval(tick, 15000); setInterval(pollOrders, 20000); setTimeout(tick, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); pollOrders(); } });
}
window.addEventListener("popstate", () => { closeSheet(); route(); });
Object.values(DB.shops).forEach(ensureAI); save();
boot();
</script>
